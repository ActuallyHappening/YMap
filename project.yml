name: YMap
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: 8495B78D24
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YMap-iOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_NAME: YMap
        PRODUCT_BUNDLE_IDENTIFIER: com.calebyates.ymap
        TARGETED_DEVICE_FAMILY: "2"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: YMap
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: YMap Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.calebyates.ymap]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.calebyates.ymap
            UTTypeDescription: YMap Document
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [ymap]
